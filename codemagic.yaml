# codemagic.yaml
workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        - env_secrets
    scripts:
      - name: Generate .env
        script: |
          cat > .env << EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          PAYDUNYA_MASTER_KEY=$PAYDUNYA_MASTER_KEY
          PAYDUNYA_PUBLIC_KEY=$PAYDUNYA_PUBLIC_KEY
          PAYDUNYA_PRIVATE_KEY=$PAYDUNYA_PRIVATE_KEY
          PAYDUNYA_TOKEN=$PAYDUNYA_TOKEN
          PAYDUNYA_MODE=$PAYDUNYA_MODE
          EOF
      - name: Install dependencies
        script: flutter pub get
      - name: Build Android APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
    publishing:
      email:
        recipients:
          - jojowendk@gmail.com

  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    environment:
      vars:
        XCODE_PROJECT: ios/Runner.xcodeproj
        XCODE_SCHEME: Runner
      flutter: stable
      groups:
        - env_secrets
    scripts:
      - name: Generate .env
        script: |
          cat > .env << EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          PAYDUNYA_MASTER_KEY=$PAYDUNYA_MASTER_KEY
          PAYDUNYA_PUBLIC_KEY=$PAYDUNYA_PUBLIC_KEY
          PAYDUNYA_PRIVATE_KEY=$PAYDUNYA_PRIVATE_KEY
          PAYDUNYA_TOKEN=$PAYDUNYA_TOKEN
          PAYDUNYA_MODE=$PAYDUNYA_MODE
          EOF
      - name: Install dependencies
        script: flutter pub get
      - name: Build iOS app
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app
    publishing:
      email:
        recipients:
          - jojowendk@gmail.com